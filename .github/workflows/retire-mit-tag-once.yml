name: Retire historical MIT release tag (one-time)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
jobs:
  retire:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Remove only the verified MIT-era tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: "v1.0.0"
          EXPECTED_TAG_OBJECT: "fe45c7c7fa26a9d0a4221f965547591816e4ebd8"
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current" != "$SHA" ]]; then
            echo "Main changed after successful CI; aborting cleanup"
            exit 1
          fi
          gh api "repos/$REPO/contents/LICENSE?ref=main" --jq '.content' | base64 -d | grep -qi "All rights reserved"
          tag_obj="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          if [[ "$tag_obj" != "$EXPECTED_TAG_OBJECT" ]]; then
            echo "Tag changed since review; aborting cleanup"
            exit 1
          fi
          if gh api "repos/$REPO/releases/tags/$TAG" > /dev/null 2>&1; then
            echo "Unexpected historical release listing; do not delete tag until reviewed"
            exit 1
          fi
          new_release="$(gh api "repos/$REPO/releases/tags/v1.0.1" --jq '.tag_name')"
          new_tag_sha="$(gh api "repos/$REPO/git/ref/tags/v1.0.1" --jq '.object.sha')"
          if [[ "$new_release" != "v1.0.1" || "$new_tag_sha" != "bb3f52524f86fc86fb586ebfdc600e04ceaa9402" ]]; then
            echo "Current All Rights Reserved release unexpectedly changed; do not delete old tag"
            exit 1
          fi
          gh api -X DELETE "repos/$REPO/git/refs/tags/$TAG"
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag still present after delete"
            exit 1
          fi
          echo "MIT-era tag retired; full Git history and existing copyright grants remain unchanged."
